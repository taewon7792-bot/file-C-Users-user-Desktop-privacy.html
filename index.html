            from { opacity: 0; transform: scale(0.95); }

    <script>
        let appConfig = {
            appName: '유유타이거',
            tagline: '온 가족이 함께 보는 꿀잼 일상 튜브',
            logoEmoji: '🐯',
            logoImage: '', // Custom uploaded logo image data URL
            primaryColor: '#ea580c', // Orange-600
            secondaryColor: '#f97316', // Orange-500
            bgColor: '#0b0f19',
            pendingTasksCount: 0
        };

        try {
            const savedConfig = localStorage.getItem('yuyu_app_config');
            if (savedConfig) appConfig = JSON.parse(savedConfig);
        } catch(e) {}

        // Apply theme variables dynamically on load
        document.addEventListener('DOMContentLoaded', () => {
            document.documentElement.style.setProperty('--primary-color', appConfig.primaryColor);
            document.documentElement.style.setProperty('--bg-color', appConfig.bgColor);
        });

        // Korean color name resolver to hex code
        function koreanColorToHex(koreanColor) {
            if (!koreanColor) return null;
            const text = koreanColor.trim().toLowerCase();
            const map = {
                '주황색': '#ea580c', '오렌지색': '#ea580c', '오렌지': '#ea580c',
                '빨간색': '#dc2626', '빨강': '#dc2626', '레드': '#dc2626',
                '파란색': '#2563eb', '파랑': '#2563eb', '블루': '#2563eb',
                '초록색': '#16a34a', '초록': '#16a34a', '녹색': '#16a34a', '그린': '#16a34a',
                '검은색': '#0b0f19', '검정': '#0b0f19', '블랙': '#0b0f19', '다크': '#0b0f19',
                '보라색': '#7c3aed', '보라': '#7c3aed', '퍼플': '#7c3aed',
                '노란색': '#ca8a04', '노랑': '#ca8a04', '옐로우': '#ca8a04', '골드': '#ca8a04',
                '분홍색': '#db2777', '핑크': '#db2777', '회색': '#334155', '그레이': '#334155',
                '하늘색': '#0ea5e9', '네이비': '#1e3a8a', '갈색': '#78350f'
            };
            if (map[text]) return map[text];
            if (text.startsWith('#')) return text;
            return null;
        }
    </script>
</head>

        function saveData() {
            try {
                localStorage.setItem('yuyu_videos', JSON.stringify(videos));

        function refreshIcons() {
            lucide.createIcons();

        function switchTab(tab) {
            if (tab === 'admin' && !isAdminLoggedIn) {
                showToast('접근 제한', '관리자 권한이 필요합니다. (하단 카피라이트 5회 클릭)');
                return;
            }

            currentTab = tab;
            
            document.querySelectorAll('.nav-link').forEach(btn => {
                if (btn.getAttribute('data-tab') === tab) {
                    btn.classList.remove('text-slate-300', 'text-slate-400');
                    btn.classList.add('text-orange-400');
                } else {
                    if(btn.getAttribute('data-tab') !== 'admin' || isAdminLoggedIn) {
                        btn.classList.remove('text-orange-400');
                        btn.classList.add(btn.getAttribute('data-tab') === 'admin' ? 'text-slate-400' : 'text-slate-300');
                    }
                }
            });

            document.querySelectorAll('.mobile-nav').forEach(btn => {
                if (btn.getAttribute('data-tab') === tab) {
                    btn.classList.remove('text-slate-400', 'bg-slate-800');
                    btn.classList.add('text-orange-400', 'bg-slate-800/80');
                } else {
                    btn.classList.remove('text-orange-400', 'bg-slate-800/80');
                    btn.classList.add('text-slate-400');
                }
            });

            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

                                    <label class="block text-[11px] text-slate-400 mb-1">메인 주 색상 (<span class="text-orange-400">주황색, 초록색, 파란색 등 한글 입력 가능</span>)</label>

                                </div>
                                <div>
                                    <label class="block text-[11px] text-slate-400 mb-1">서브 색상 (<span class="text-orange-400">한글 색상명 입력 가능</span>)</label>
                                    <input type="text" id="adm-config-secondary" value="${escapeHtml(appConfig.secondaryColor)}" placeholder="예: 오렌지색 또는 #f97316" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">

                        </div>

                        <!-- Admin Sections Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Notice Manager -->
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 shadow-xl">
                                <h3 class="font-bold text-sm text-white flex items-center gap-2 border-b border-slate-800 pb-3 truncate">

                                </h3>
                                <div class="space-y-3">
                                    <div>
                                        <label class="block text-[11px] text-slate-400 mb-1">공지 제목</label>

                                    <i data-lucide="youtube" class="w-4 h-4 text-red-500 shrink-0"></i> <span>새 유튜브 영상 추가</span>

                                <div class="space-y-3">
                                    <div>

                        <!-- AI Feature & Widget Adder -->
                        <div class="bg-slate-900 border border-orange-500/40 p-6 rounded-3xl space-y-4 shadow-xl relative overflow-hidden">
                            <div class="absolute -right-6 -bottom-6 text-7xl opacity-10 select-none pointer-events-none">✨</div>
                            <h3 class="font-bold text-sm text-white flex items-center gap-2 border-b border-slate-800 pb-3 truncate">
                                <i data-lucide="sparkles" class="w-4 h-4 text-orange-400 shrink-0"></i> <span>사이트 기능 및 맞춤형 위젯 추가</span>
                            </h3>
                            <p class="text-xs text-slate-300 leading-relaxed">
                                <strong>💡 위젯 추가 방법:</strong> 추가하고 싶은 기능을 자연어로 적어주시면 홈 화면에 완전한 인터랙티브 위젯으로 즉시 추가됩니다!

                                    <textarea id="adm-ai-prompt" rows="3" placeholder="예: 팬아트 콘테스트 투표함 만들어줘" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white resize-none focus:outline-none focus:border-orange-500"></textarea>
                                </div>
                                <button onclick="generateAIFeature()" class="w-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white py-3 rounded-xl text-xs font-bold shadow-lg shadow-orange-600/20 transition flex items-center justify-center gap-2">
                                    <i data-lucide="cpu" class="w-4 h-4"></i> 맞춤 위젯 기능 즉시 코딩 및 추가하기

                        </div>
                    </div>
                `;
            }

            refreshIcons();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function openVideo(url) {
            window.open(url, '_blank', 'noopener,noreferrer');
        }

        function postMessage() {
            const author = document.getElementById('author-input').value.trim();
            const role = document.getElementById('role-select').value;
            const content = document.getElementById('content-input').value.trim();

            if (!author || !content) {
                showToast('입력 오류', '닉네임과 메시지 내용을 모두 입력해주세요!');
                return;
            }

            const isCreator = role === '크리에이터';

            messages.unshift({
                id: Date.now(),
                author: author,
                role: isCreator ? '가족 크리에이터' : '팬',
                content: content,
                time: '방금 전',
                isCreator: isCreator,
                likes: 1
            });

            saveData();
            document.getElementById('author-input').value = '';
            document.getElementById('content-input').value = '';
            showToast('등록 완료', '소통방에 메시지가 성공적으로 등록되었습니다!');
            renderContent();
        }

        function likeMessage(id) {
            const msg = messages.find(m => m.id === id);
            if (msg) {
                msg.likes++;
                saveData();
                renderContent();
            }
        }

        function deleteMessage(id) {
            messages = messages.filter(m => m.id !== id);
            saveData();
            showToast('삭제 완료', '메시지가 삭제되었습니다.');
            renderContent();
        }

        function simulateFamilyVisit() {
            const familyMembers = [
                { name: '첫째 딸', text: '다들 안녕하세요! 오늘 학교 끝나고 앱 들어왔어요 다들 반가워요 💙' },
                { name: '막내 딸', text: '안녕하세요! 오늘 언니랑 맛있는 간식 먹었어요 모두 좋은 하루 보내세요! 🍊' },
                { name: '엄마', text: '안녕하세요! 우리 팬분들 늘 응원해주셔서 정말 힘이 납니다 항상 건강하세요! 🥰' },
                { name: '아빠', text: '어흥! 아빠 등장입니다 🐯 다들 멋진 팬들이시군요 대단해요!' }
            ];

            const randomMember = familyMembers[Math.floor(Math.random() * familyMembers.length)];

            messages.unshift({
                id: Date.now(),
                author: randomMember.name,
                role: '크리에이터',
                content: randomMember.text,
                time: '방금 전 (실시간 방문)',
                isCreator: true,
                likes: 88
            });

            saveData();
            showToast('서프라이즈 방문!', `${randomMember.name}님이 소통방에 깜짝 방문하셨습니다! 🎉`);
            if (currentTab === 'livechat') {
                renderContent();
            }
        }

        function votePoll(id, option) {
            const countEl = document.getElementById(`poll-${id}-${option}`);
            if (countEl) {
                let currentCount = parseInt(countEl.innerText) || 0;
                countEl.innerText = (currentCount + 1) + '표';
                showToast('투표 완료', '소중한 한 표가 성공적으로 반영되었습니다!');
            }
        }

        // Handle logo file upload
        function handleLogoFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                appConfig.logoImage = e.target.result;
                showToast('로고 업로드', '이미지 로고가 성공적으로 등록되었습니다.');
            };
            reader.readAsDataURL(file);
        }

        // Update app name, theme settings supporting Korean color names
        function updateAppThemeSettings() {
            appConfig.appName = document.getElementById('adm-config-name').value.trim() || '유유타이거';
            appConfig.logoEmoji = document.getElementById('adm-config-emoji').value.trim() || '🐯';
            appConfig.pendingTasksCount = parseInt(document.getElementById('adm-config-pending').value) || 0;
            
            const rawPrimary = document.getElementById('adm-config-primary').value.trim();
            const rawSecondary = document.getElementById('adm-config-secondary').value.trim();
            const rawBg = document.getElementById('adm-config-bg').value.trim();

            const resolvedPrimary = koreanColorToHex(rawPrimary);
            const resolvedSecondary = koreanColorToHex(rawSecondary);
            const resolvedBg = koreanColorToHex(rawBg);

            if (resolvedPrimary) appConfig.primaryColor = resolvedPrimary;
            if (resolvedSecondary) appConfig.secondaryColor = resolvedSecondary;
            if (resolvedBg) appConfig.bgColor = resolvedBg;

            document.documentElement.style.setProperty('--primary-color', appConfig.primaryColor);
            document.documentElement.style.setProperty('--bg-color', appConfig.bgColor);

            // Update Header & Footer app name text instantly everywhere
            document.querySelectorAll('.app-name-text').forEach(el => {
                el.innerText = appConfig.appName;
            });

            const logoContainer = document.getElementById('header-logo-container');
            if (logoContainer) {
                if (appConfig.logoImage) {
                    logoContainer.innerHTML = `<img src="${appConfig.logoImage}" alt="Logo" class="w-full h-full object-cover">`;
                } else {
                    logoContainer.innerText = appConfig.logoEmoji;
                }
            }

            saveData();
            showToast('설정 완료', '앱 이름과 한글 색상 테마가 즉시 반영되었습니다!');
            renderContent();
        }

        // Reset App Theme Settings to Default
        function resetAppThemeSettings() {
            appConfig = {
                appName: '유유타이거',
                tagline: '온 가족이 함께 보는 꿀잼 일상 튜브',
                logoEmoji: '🐯',
                logoImage: '',
                primaryColor: '#ea580c',
                secondaryColor: '#f97316',
                bgColor: '#0b0f19',
                pendingTasksCount: 0
            };

            document.documentElement.style.setProperty('--primary-color', appConfig.primaryColor);
            document.documentElement.style.setProperty('--bg-color', appConfig.bgColor);

            document.querySelectorAll('.app-name-text').forEach(el => {
                el.innerText = appConfig.appName;
            });

            const logoContainer = document.getElementById('header-logo-container');
            if (logoContainer) {
                logoContainer.innerText = appConfig.logoEmoji;
            }

            saveData();
            showToast('초기화 완료', '앱 디자인과 테마가 기본값으로 초기화되었습니다.');
            renderContent();
        }

        function updateNotice() {
            const title = document.getElementById('adm-notice-title-input').value.trim();
            const content = document.getElementById('adm-notice-content-input').value.trim();
            if(!title || !content) {
                showToast('입력 오류', '제목과 내용을 모두 입력해주세요.');
                return;
            }
            officialNotice = { title, content };
            saveData();
            showToast('반영 완료', '메인 공지사항이 업데이트되었습니다.');
        }

        function addAdminVideo() {
            const title = document.getElementById('adm-vid-title').value.trim();
            const url = document.getElementById('adm-vid-url').value.trim();
            const views = document.getElementById('adm-vid-views').value.trim() || '1만회';
            const time = document.getElementById('adm-vid-time').value.trim() || '방금 전';

            if (!title || !url) {
                showToast('입력 오류', '영상 제목과 유튜브 URL을 모두 입력해주세요.');
                return;
            }

            videos.unshift({
                id: 'vid_' + Date.now(),
                title: title,
                views: views,
                time: time,
                thumb: `https://placehold.co/600x338/ea580c/ffffff?text=${encodeURIComponent(title.slice(0, 12))}`,
                url: url
            });

            saveData();
            showToast('추가 완료', '새로운 영상이 등록되었습니다.');
            document.getElementById('adm-vid-title').value = '';
            document.getElementById('adm-vid-url').value = '';
            document.getElementById('adm-vid-views').value = '';
            document.getElementById('adm-vid-time').value = '';
        }

        function generateAIFeature() {
            const prompt = document.getElementById('adm-ai-prompt').value.trim();
            if(!prompt) {
                showToast('입력 오류', '추가할 기능을 적어주세요.');
                return;
            }

            showToast('기능 분석 중...', '요청을 분석하여 위젯을 생성하고 있습니다...');

            setTimeout(() => {
                const newId = 'ai_feat_' + Date.now();
                customFeatures.push({
                    id: newId,
                    title: `✨ 맞춤 위젯: ${prompt.slice(0, 15)}...`,
                    badge: '커스텀 위젯',
                    type: 'poll',
                    desc: `요청 내용: "${prompt}" 에 맞추어 생성된 실시간 상호작용 위젯입니다.`,
                    guide: '💡 위젯이 성공적으로 생성되어 홈 화면에 배치되었습니다!'
                });

                saveData();
                document.getElementById('adm-ai-prompt').value = '';
                showToast('생성 완료!', '위젯이 성공적으로 코딩되어 홈 화면에 추가되었습니다.');
                switchTab('home');
            }, 1000);
        }

        function deleteFeature(id) {
            customFeatures = customFeatures.filter(f => f.id !== id);
            saveData();
            showToast('삭제 완료', '위젯 기능이 제거되었습니다.');
            renderContent();
        }

        function handleCopyrightClick() {
            copyrightClickCount++;
            if (copyrightTimer) clearTimeout(copyrightTimer);
            
            if (copyrightClickCount >= 5) {
                copyrightClickCount = 0;
                document.getElementById('admin-modal').classList.remove('hidden');
                return;
            }

            copyrightTimer = setTimeout(() => {
                copyrightClickCount = 0;
            }, 2000);
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function handleAdminLogin() {
            const idInput = document.getElementById('admin-id').value.trim();
            const pwInput = document.getElementById('admin-pw').value.trim();

            if (idInput === 'admin' && pwInput === 'Yuyu Tiger 1518') {
                isAdminLoggedIn = true;
                closeAdminModal();
                showToast('로그인 성공', '관리자 권한이 활성화되었습니다.');
                document.getElementById('nav-admin-btn').classList.remove('hidden');
                document.getElementById('mobile-nav-admin').classList.remove('hidden');
                switchTab('admin');
            } else {
                showToast('로그인 실패', '아이디 또는 비밀번호가 올바르지 않습니다.');
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('nav-admin-btn').classList.add('hidden');
            document.getElementById('mobile-nav-admin').classList.add('hidden');
            document.getElementById('admin-id').value = '';
            document.getElementById('admin-pw').value = '';
            showToast('로그아웃', '관리자 모드가 해제되었습니다.');
            switchTab('home');
        }

        function showToast(title, desc) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-desc').innerText = desc;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }

        window.onload = function() {
            renderContent();
        };
    </script>
